<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f2937">
<title>0-9 数字分析ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>0-9 数字分析ツール</h1>
  <p>数字を押すだけで記録・集計します</p>
</header>

<main>
  <section class="card input-card">
    <h2>数字を記録</h2>
    <div class="number-grid" id="numberGrid"></div>
    <div class="action-row">
      <button id="undoBtn" class="secondary">↩ 一つ戻す</button>
      <button id="resetBtn" class="danger">リセット</button>
    </div>
    <div class="record-info">
      <span>記録数</span>
      <strong id="recordCount">0</strong>
    </div>
  </section>

  <section class="card">
    <h2>現在の分析</h2>
    <div class="highlight">
      <div>
        <span class="label">現在の最頻出数字</span>
        <strong id="topNumber">-</strong>
      </div>
      <div>
        <span class="label">次の候補（暫定）</span>
        <strong id="candidateNumber">-</strong>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>数字</th>
            <th>回数</th>
            <th>実測率</th>
            <th>理論率</th>
            <th>差</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>パターン分析</h2>
    <p class="note">a=1・2・3　b=4・5・6　c=7・8・9<br>
    d=1・4・7　e=2・5・8　f=3・6・9</p>

    <div class="pattern-box">
      <span>数字履歴</span>
      <div id="numberHistory" class="history">まだありません</div>
    </div>
    <div class="pattern-box">
      <span>パターン履歴</span>
      <div id="patternHistory" class="history">まだありません</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>パターン</th><th>出現回数</th><th>出現率</th></tr>
        </thead>
        <tbody id="patternBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>推移</h2>
    <div class="chart-area">
      <canvas id="trendChart"></canvas>
    </div>
    <p class="note">現在は直近の数字推移を表示します。今後、出現率・パターン・遷移などを追加できます。</p>
  </section>
</main>

<footer>
  <small>データはこのブラウザ内に保存されます。</small>
</footer>

<script src="script.js"></script>
</body>
</html>
